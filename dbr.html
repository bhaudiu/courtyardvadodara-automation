<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DBR · Courtyard Vadodara</title>
<meta name="description" content="Daily Business Report — Courtyard by Marriott Vadodara." />
<style>
  :root{--bg:#eef1f5;--panel:#ffffff;--panel-2:#f8fafc;--line:#e2e7ee;--line-soft:#eef1f5;
    --text:#1b2735;--muted:#5c6976;--faint:#8b96a3;--accent:#b0143c;--accent-soft:#c22450;
    --good:#1f9d57;--bad:#d64562;--warn:#d1841c;--blue:#3b82c4;--head:#f1f4f8;--sec:#eaeef3;--gold:#b8862f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 85% -10%,#ffffff 0%,var(--bg) 60%);color:var(--text);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
  .bar{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:600}
  .logo{width:33px;height:33px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7a0d29);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;box-shadow:0 4px 14px rgba(176,20,60,.35)}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:18px}
  nav a:hover{color:var(--text)}
  .page{padding:24px 0 56px}
  .titlerow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px}
  h1{font-size:23px;font-weight:700;letter-spacing:-.3px}
  .picker{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
  .picker label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .picker select{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:14px;font-weight:600;cursor:pointer;min-width:210px}
  .picker select:focus{outline:2px solid var(--ring);border-color:var(--accent)}
  .picker input[type=number]{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:14px;font-weight:600;width:76px}
  .picker input[type=number]:focus{outline:2px solid var(--ring);border-color:var(--accent)}
  .sub{color:var(--muted);font-size:13.5px;margin:2px 0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .refbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .refbtn:hover{color:var(--text);border-color:var(--accent)}
  .refbtn:disabled{opacity:.7;cursor:default}
  .refbtn .ic{display:inline-block;font-size:14px}
  .refbtn.spin .ic{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
  .badge.ok{color:var(--good);border-color:#2c6b55}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .sechead{display:flex;align-items:center;gap:10px;margin:24px 2px 12px}
  .sechead h2{font-size:14px;font-weight:700}
  .aichip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--accent),#7a0d29);padding:3px 8px;border-radius:6px}
  .note{font-size:12px;color:var(--faint)}

  .hero{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:14px;margin-bottom:8px}
  @media(max-width:760px){.hero{grid-template-columns:1fr 1fr}}
  .hcard{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;padding:15px 18px}
  .hcard.today{border-color:rgba(176,20,60,.28);background:linear-gradient(135deg,#fdeef2,#ffffff)}
  .hcard .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:7px}
  .hcard.today .lbl{color:var(--accent-soft)}
  .hcard .v{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .hcard .vs{font-size:12px;color:var(--faint);margin-top:5px}

  .summary{background:linear-gradient(135deg,#fdeef2,#f8fafc);border:1px solid rgba(176,20,60,.22);border-radius:12px;padding:13px 18px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
  .summary .ic{font-size:17px}.summary .tx{font-size:14px;font-weight:500}
  .icards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.icards{grid-template-columns:1fr}}
  .icard{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .icard .ih{padding:11px 16px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--line)}
  .icard.win .ih{color:var(--good)}.icard.watch .ih{color:var(--warn)}.icard.act .ih{color:var(--accent-soft)}
  .icard ul{list-style:none;padding:6px 0}
  .icard li{padding:9px 16px;border-bottom:1px solid var(--line-soft)}
  .icard li:last-child{border-bottom:none}
  .icard li .t{font-size:13px;font-weight:600;margin-bottom:2px}
  .icard li .d{font-size:12px;color:var(--muted)}
  .icard.act li .t::before{content:"→ ";color:var(--accent-soft)}

  .crow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:820px){.crow{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
  svg{display:block;width:100%;height:auto}
  .chartwrap{position:relative}
  .tt{position:absolute;pointer-events:none;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;opacity:0;transition:opacity .1s;white-space:nowrap;transform:translate(-50%,-115%);box-shadow:0 6px 18px rgba(20,30,45,.18)}
  .tt b{color:var(--accent-soft)}
  .mix{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .mix span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;min-width:2px}
  .mixleg{display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:13px}
  .mixleg .row{display:flex;align-items:center;gap:9px}
  .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .mixleg .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
  .spark .big{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .spark .cap{font-size:12px;color:var(--faint);margin-top:2px}
  .chleg{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .chleg span{display:inline-flex;align-items:center;gap:7px}
  .chleg i{width:16px;height:0;border-top:3px solid currentColor;display:inline-block;border-radius:2px}
  .chleg i.dash{border-top-style:dashed}
  .chhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .chhead h3{margin:0}
  .cbtns{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--head);border:1px solid var(--line);border-radius:9px;padding:3px}
  .cbtn{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
  .cbtn:hover{color:var(--text)}
  .cbtn.on{background:linear-gradient(135deg,var(--accent),#7a0d29);color:#fff}

  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .mgrid>div{background:var(--panel);padding:13px 16px}
  .mgrid .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .mgrid .v{font-size:17px;font-weight:600}
  @media(max-width:520px){.mgrid{grid-template-columns:repeat(2,1fr)}}
  .cols2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
  @media(max-width:820px){.cols2{grid-template-columns:1fr}}
  .dcard{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dcard .dh{padding:12px 16px 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  table.dt{width:100%;border-collapse:collapse;font-size:13px}
  table.dt th,table.dt td{padding:9px 16px;text-align:right;border-bottom:1px solid var(--line-soft)}
  table.dt th:first-child,table.dt td:first-child{text-align:left}
  table.dt thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:600}
  table.dt tbody tr:last-child td{border-bottom:none}
  table.dt tr:hover td{background:#f1f4f8}
  table.dt td.num{font-variant-numeric:tabular-nums}
  table.dt td.rev{font-weight:600}
  table.dt tr.tot td{background:var(--head);font-weight:700;border-top:1px solid var(--line)}
  .mb{display:inline-block;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent-soft));vertical-align:middle;margin-left:8px;box-shadow:0 0 8px rgba(176,20,60,.35)}

  .reportwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel)}
  table.report{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
  table.report th,table.report td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
  table.report thead th{position:sticky;top:0;background:var(--head);z-index:2}
  .grp th{border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent-soft);text-align:center;padding-top:11px}
  .grp th.g-mtd{color:#3f6fa0}.grp th.g-ytd{color:#8a5cc0}
  .subh th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding-bottom:10px}
  th.stick,td.stick{position:sticky;left:0;text-align:left;background:var(--head);z-index:3;min-width:186px;border-right:1px solid var(--line)}
  tbody td.stick{background:var(--panel)}
  tbody tr:hover td{background:#f1f4f8}
  tbody tr:hover td.stick{background:#e9edf2}
  td.num{font-variant-numeric:tabular-nums}
  tr.sec td{background:var(--sec);color:var(--accent-soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.7px;text-align:left;position:sticky;left:0}
  tr.total td{font-weight:700;background:#f7edf1}tr.total td.stick{background:#f7edf1}
  .var.up{color:var(--good)}.var.down{color:var(--bad)}
  .divg{border-left:1px solid var(--line)}
  footer{border-top:1px solid var(--line);padding:20px 0;color:var(--faint);font-size:12.5px;margin-top:24px}
  .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .err{padding:40px;text-align:center;color:var(--muted)}
  .hint{font-size:12px;color:var(--faint);margin:8px 2px 0}
  .tabnav{display:flex;margin:16px 0 24px}
  .tabbar{display:inline-flex;gap:4px;background:var(--head);border:1px solid var(--line);border-radius:12px;padding:5px}
  @media(max-width:600px){.tabbar{display:flex;width:100%;justify-content:space-between}}
  .tab{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:9px 20px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),#7a0d29);box-shadow:0 4px 13px rgba(176,20,60,.4)}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:6px}
  @media(max-width:760px){.pgrid{grid-template-columns:1fr}}
  .pcard{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .pcard .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
  .pcard .v{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .pcard .vs{font-size:12.5px;color:var(--faint);margin-top:6px}
  .pk-grid{display:grid;grid-template-columns:1fr;gap:16px}
  .pk-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pk-mhead{background:var(--head);text-align:center;font-weight:700;font-size:14px;padding:10px;border-bottom:1px solid var(--line)}
  .pk-ai{display:flex;gap:9px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fdeef2,#f8fafc);font-size:12.5px;color:var(--text);line-height:1.5}
  .pk-ai .ic{color:var(--accent-soft);font-size:14px;flex:0 0 auto}
  .pk-scroll{overflow-x:auto}
  td.occ{padding:5px 8px;min-width:96px}
  .occbar{position:relative;height:19px;border-radius:5px;background:#eef1f5;border:1px solid var(--line-soft);overflow:hidden}
  .occfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px}
  .occbar span{position:relative;z-index:1;display:block;text-align:center;line-height:19px;font-size:11px;font-weight:700;color:#1b2735;text-shadow:0 0 2px #fff,0 0 3px #fff}
  .pk-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 2px 16px;font-size:12px;color:var(--muted)}
  .pk-legend .lg-label{text-transform:uppercase;letter-spacing:.6px;font-size:10.5px;font-weight:600}
  .pk-legend .lg-item{display:inline-flex;align-items:center;gap:6px}
  .pk-legend i{width:15px;height:11px;border-radius:3px;display:inline-block}
  table.pk{width:100%;border-collapse:collapse;font-size:12px}
  table.pk th.grp{text-align:center;color:var(--accent-soft);font-size:10px;border-bottom:1px solid var(--line)}
  table.pk tr.subh th{font-size:9.5px;color:var(--faint);font-weight:600;top:23px}
  table.pk th,table.pk td{padding:6px 7px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
  table.pk th:last-child,table.pk td:last-child{border-right:none}
  table.pk th.grp{border-left:1px solid var(--line)}
  table.pk th:first-child,table.pk td:first-child{text-align:left}
  table.pk thead th{position:sticky;top:0;background:var(--head);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;z-index:1}
  table.pk td.num{font-variant-numeric:tabular-nums}
  table.pk td.up{color:var(--good)}table.pk td.down{color:var(--bad)}
  table.pk td.occ{color:var(--text);font-weight:600;text-align:center}
  table.pk tr:hover td{background:#f1f4f8}
  table.pk tr.pk-tot td{background:var(--head);font-weight:700;border-top:1px solid var(--line);position:sticky;bottom:0}
  table.pk tr.pk-tot td.occ{color:var(--text)}
  .str-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .str-cap{background:var(--head);text-align:center;font-weight:700;font-size:13.5px;padding:10px;border-bottom:1px solid var(--line)}
  table.str{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
  table.str th,table.str td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
  table.str th.grp{text-align:center;color:var(--accent-soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
  table.str tr.subh th{font-size:10px;color:var(--muted);font-weight:600}
  table.str thead th{background:var(--head)}
  td.str-per,th.str-per{text-align:left;font-weight:600;color:var(--text);background:var(--head);position:sticky;left:0;border-right:1px solid var(--line)}
  table.str td.num{font-variant-numeric:tabular-nums}
  table.str td.idx{color:var(--accent-soft);font-weight:600}
  table.str td.idx.up{color:var(--good)}
  table.str td.idx.down{color:var(--bad)}
  table.str tbody tr:hover td{background:#f1f4f8}
  table.str tbody tr:hover td.str-per{background:#e9edf2}
  .hcard,.icard,.card,.dcard,.pcard,.pk-panel,.str-card,.reportwrap,.mgrid{box-shadow:0 1px 3px rgba(20,35,60,.06),0 1px 2px rgba(20,35,60,.04)}
  .hcard.today{box-shadow:0 1px 3px rgba(176,20,60,.10)}
  .refbtn{box-shadow:0 1px 2px rgba(20,35,60,.05)}
  .dlbtn{margin-left:auto;background:linear-gradient(135deg,#1f7a44,#155e33);border:1px solid #2c6b55;color:#fff;font-size:12px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .dlbtn:hover{filter:brightness(1.1)}
  .printonly{display:none}

  /* ===== Redesigned DBR shell (sidebar + dashboard) ===== */
  .shell{display:flex;min-height:100vh}
  .side{width:214px;flex:0 0 214px;background:linear-gradient(180deg,#0f1e42,#16295a);color:#c9d3ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sbrand{padding:20px 20px 14px}
  .sbrand .slogo{font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:700;letter-spacing:2px;color:#fff}
  .sbrand .by{font-size:8px;letter-spacing:3px;color:#8ea0c8;margin-top:2px}
  .sbrand .prop{font-size:13px;color:#aab8d8;margin-top:9px;font-weight:600}
  .side nav{margin-top:6px;flex:1;overflow-y:auto}
  .side a{display:flex;align-items:center;gap:11px;padding:11px 20px;color:#aeb9d4;text-decoration:none;font-size:13.5px;font-weight:500;border-left:3px solid transparent;cursor:pointer}
  .side a .i{width:16px;text-align:center;opacity:.9}
  .side a:hover{color:#fff;background:rgba(255,255,255,.04)}
  .side a.on{color:#fff;background:linear-gradient(90deg,rgba(70,110,220,.30),rgba(70,110,220,.05));border-left-color:#4f7fe0}
  .side .sfoot{padding:15px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8593b4}
  .side .sfoot b{color:#c9d3ea;font-weight:600}
  .main{flex:1;min-width:0;padding:22px 26px 44px;max-width:1500px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .top h1{font-size:21px;font-weight:700}
  .subt{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .banner{background:#fff8e6;border:1px solid #f0dca0;color:#8a6d1f;font-size:12px;padding:8px 13px;border-radius:9px;margin-bottom:16px}
  .ncard{background:var(--card,#fff);border:1px solid var(--line);border-radius:13px;box-shadow:0 1px 3px rgba(20,35,60,.05)}
  .ch{display:flex;align-items:center;gap:9px;padding:14px 17px 4px;font-size:14px;font-weight:700}
  .ch .i{color:var(--accent)}
  .ch .note{margin-left:auto}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}
  @media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{padding:15px 16px}
  .kpi .kh{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .kpi .kic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#fff}
  .kpi .klb{font-size:12.5px;color:var(--muted);font-weight:600}
  .kpi .kval{font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:baseline;gap:9px}
  .chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
  .chip.up{color:var(--good);background:rgba(31,157,87,.12)}
  .chip.down{color:var(--bad);background:rgba(224,71,95,.12)}

<body data-palette="#b0143c">
<main id="app"><div class="err" id="loading" style="padding:40px">Loading report…</div></main>

<script>
const INR=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const INR2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const rs=v=>v==null?'—':'₹'+INR.format(Math.round(v));
const num=v=>v==null?'—':INR.format(Math.round(v));
const MONTHS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let DATA=null;

function dObj(iso){return new Date(iso+'T00:00:00');}
function labelDate(iso){const d=dObj(iso);return `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()+1]} ${d.getFullYear()}`;}
function lyIso(iso){return (parseInt(iso.slice(0,4))-1)+iso.slice(4);}
function pctStr(p){return (p>=0?'+':'')+(p*100).toFixed(0)+'%';}

/* ---------- insights ---------- */
function ACTION(label){
  const l=label.toLowerCase();
  if(/banquet|bqts/.test(l))return 'Push the banquet & events pipeline — confirm tentative bookings.';
  if(/bgc|baroda/.test(l))return 'Review Baroda Grill covers, footfall and pricing.';
  if(/deck|starbucks/.test(l))return 'Lift The Deck footfall with a promotion.';
  if(/brubon/.test(l))return 'Drive Brubon covers with a daypart offer.';
  if(/transport/.test(l))return 'Check transport-desk usage and tie-ups.';
  return 'Review pricing, covers and promotions to close the gap.';
}
function dayInsights(iso){
  const cur=DATA.days[iso]; const ly=DATA.days[lyIso(iso)];
  const oi=cur.operating_income;
  if(!ly){
    const tops=[...cur.outlet_details].filter(o=>o.revenue).sort((a,b)=>b.revenue-a.revenue).slice(0,3);
    return {summary:`Total hotel revenue ${rs(oi.total_hotel_revenue)} · occupancy ${(oi.occupancy*100).toFixed(0)}% · ADR ${rs(oi.adr)}.`,
      highlights:tops.map(o=>({title:`${o.name} — ${rs(o.revenue)}`,detail:`${num(o.covers)} covers · avg ${rs(o.avg_check)}`})),
      watch:[],action_items:[]};
  }
  const lyoi=ly.operating_income;
  const items=[];
  cur.outlet_details.forEach(o=>{const l=ly.outlet_details.find(x=>x.name===o.name);if(l&&o.revenue!=null&&l.revenue!=null)items.push({name:o.name,cur:o.revenue,ly:l.revenue});});
  cur.ood.forEach(o=>{const l=ly.ood.find(x=>x.name===o.name);if(l&&o.revenue!=null&&l.revenue!=null)items.push({name:o.name,cur:o.revenue,ly:l.revenue});});
  items.forEach(i=>{i.delta=i.cur-i.ly;i.pct=i.ly?i.delta/Math.abs(i.ly):null;});
  const MAT=8000;
  const wins=items.filter(i=>i.delta>=MAT).sort((a,b)=>b.delta-a.delta).slice(0,3);
  const cons=items.filter(i=>i.delta<=-MAT).sort((a,b)=>a.delta-b.delta).slice(0,3);
  const totDelta=oi.total_hotel_revenue-lyoi.total_hotel_revenue;
  const totPct=lyoi.total_hotel_revenue?totDelta/lyoi.total_hotel_revenue:0;
  const tone=totPct>=0.03?'Ahead of last year':(totPct<=-0.03?'Behind last year':'In line with last year');
  const drivers=wins.slice(0,2).map(w=>w.name).join(', ');
  return {
    summary:`${tone} — total hotel revenue ${rs(oi.total_hotel_revenue)}, ${pctStr(totPct)} vs same day 2025`+(drivers?`, led by ${drivers}.`:'.'),
    highlights:[{title:`Total revenue ${pctStr(totPct)} YoY`,detail:`${rs(oi.total_hotel_revenue)} vs ${rs(lyoi.total_hotel_revenue)} last year.`}]
      .concat(wins.map(w=>({title:`${w.name} up ${rs(w.delta)} YoY`,detail:`${rs(w.cur)} vs ${rs(w.ly)} (${pctStr(w.pct)}).`}))),
    watch:cons.map(c=>({title:`${c.name} ${pctStr(c.pct)} YoY`,detail:`${rs(c.cur)} vs ${rs(c.ly)} last year (${rs(-c.delta)} lower).`})),
    action_items:cons.map(c=>({title:`${c.name}: ${rs(-c.delta)} behind last year`,detail:ACTION(c.name)})),
  };
}

/* ---------- charts ---------- */
function budFromReport(day,label){const r=day.report;if(!r)return null;for(const s of r)for(const row of s.rows)if(row.label&&row.label.indexOf(label)===0)return row.today_bud;return null;}
function oodRev(day,name){const o=(day.ood||[]).find(x=>x.name===name);return o?o.revenue:null;}
function fbv(day,key){return day.fb_details?day.fb_details[key]:null;}
const METRICS={
  total:{key:'total_hotel_revenue',ly:'ly_total',bud:'bud_total',label:'Total',title:'Total Revenue'},
  room:{key:'room_revenue',ly:'ly_room',bud:'bud_room',label:'Room',title:'Room Revenue'},
  fb:{key:'fb_revenue',ly:'ly_fb',bud:'bud_fb',label:'F&B',title:'F&B Revenue'},
  rnl:{key:'rnl',ly:'ly_rnl',bud:'bud_rnl',label:'812 CE Rest.',title:'812 CE Restaurant (RNL)'},
  banq:{key:'banq',ly:'ly_banq',bud:'bud_banq',label:'Banquet',title:'Banquet Revenue'},
  wine:{key:'wine',ly:'ly_wine',bud:'bud_wine',label:'Wine Shop',title:'Wine Shop Revenue'},
  spa:{key:'spa',ly:'ly_spa',bud:'bud_spa',label:'Spa',title:'Spa Revenue'},
};
let SELMETRIC='total';
let SELRANGE='month';   // 'month' or a number of days (trend window ending at the selected date)
function buildDay(k){
  const day=DATA.days[k],lyk=lyIso(k),lyDay=DATA.days[lyk]||null,lyd=lyDay?lyDay.operating_income:null;
  return {iso:k,day:dObj(k).getDate(),mo:dObj(k).getMonth()+1,...day.operating_income,
    rnl:fbv(day,'total_rnl'), banq:fbv(day,'banquet_other'),
    wine:oodRev(day,'Wine Shop'), spa:oodRev(day,'Spa'),
    ly_total:lyd?lyd.total_hotel_revenue:null, ly_room:lyd?lyd.room_revenue:null,
    ly_fb:lyd?lyd.fb_revenue:null,
    ly_rnl:lyDay?fbv(lyDay,'total_rnl'):null, ly_banq:lyDay?fbv(lyDay,'banquet_other'):null,
    ly_wine:lyDay?oodRev(lyDay,'Wine Shop'):null, ly_spa:lyDay?oodRev(lyDay,'Spa'):null,
    bud_total:budFromReport(day,'Total Hotel Revenue'), bud_room:budFromReport(day,'Room Revenue'),
    bud_fb:budFromReport(day,'F&B Revenue'), bud_rnl:budFromReport(day,'Total RNL'),
    bud_banq:budFromReport(day,'Banquet & Other Than F&B'),
    bud_wine:budFromReport(day,'Wine Shop'), bud_spa:budFromReport(day,'Spa')};
}
function monthSeries(iso){
  const pre=iso.slice(0,7);
  return Object.keys(DATA.days).filter(k=>k.slice(0,7)===pre).sort().map(buildDay);
}
function rangeSeries(iso,n){
  // the last n days on or before the selected date (skips gaps; may cross month boundaries)
  const ks=Object.keys(DATA.days).filter(k=>k<=iso&&k>='2026-01-01').sort();
  return ks.slice(-Math.max(2,n)).map(buildDay);
}
function chartSeries(iso){return SELRANGE==='month'?monthSeries(iso):rangeSeries(iso,+SELRANGE||30);}
const CLR_LY='#4f9fd0',CLR_BUD='#c99a3f';
function lineChart(series,m,color,selDay){
  const W=640,H=200,pl=48,pr=12,pt=14,pb=24;
  const allv=[];series.forEach(d=>{if(d[m.key]!=null)allv.push(d[m.key]);if(d[m.ly]!=null)allv.push(d[m.ly]);if(d[m.bud]!=null)allv.push(d[m.bud]);});
  const ymax=Math.max(...allv)*1.08||1;
  const x=i=>pl+(series.length<2?0:i/(series.length-1)*(W-pl-pr));
  const y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const pathFor=key=>{let d='',pen=false;series.forEach((s,i)=>{const v=s[key];if(v==null){pen=false;return;}d+=`${pen?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;pen=true;});return d.trim();};
  const line=pathFor(m.key);
  const area=`${line} L${x(series.length-1).toFixed(1)},${H-pb} L${x(0).toFixed(1)},${H-pb} Z`;
  const budPath=pathFor(m.bud),lyPath=pathFor(m.ly);
  let grid='';for(let g=0;g<=3;g++){const gv=ymax*g/3,gy=y(gv);grid+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#dbe1e9"/><text x="${pl-7}" y="${gy+4}" text-anchor="end" fill="var(--faint)" font-size="10">${(gv/1e5).toFixed(1)}L</text>`;}
  const step=Math.max(1,Math.ceil(series.length/16));   // ~16 labels max, whatever the range
  let xl='';series.forEach((d,i)=>{if(i%step===0||i===series.length-1)xl+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" fill="${d.iso===series[series.length-1].iso?'var(--accent-soft)':'var(--faint)'}" font-size="10" font-weight="${d.iso===series[series.length-1].iso?'700':'400'}">${d.day}</text>`;});
  const dots=series.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d[m.key]).toFixed(1)}" r="${d.day===selDay?4.5:2.6}" fill="${d.day===selDay?'var(--accent-soft)':'#ffffff'}" stroke="${color}" stroke-width="2"/>`).join('');
  const hit=series.map((d,i)=>`<rect x="${(x(i)-(W-pl-pr)/series.length/2).toFixed(1)}" y="${pt}" width="${((W-pl-pr)/series.length).toFixed(1)}" height="${H-pt-pb}" fill="transparent" data-i="${i}" class="hit"/>`).join('');
  const svg=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#g1)"/>`
    +(budPath?`<path d="${budPath}" fill="none" stroke="${CLR_BUD}" stroke-width="1.7" stroke-dasharray="5 4" opacity="0.95"/>`:'')
    +(lyPath?`<path d="${lyPath}" fill="none" stroke="${CLR_LY}" stroke-width="1.9" opacity="0.92"/>`:'')
    +`<path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/><line id="cr" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="${color}" stroke-dasharray="3 3" opacity="0"/>${dots}${xl}${hit}</svg>`;
  return {svg,x,y,W,H,series};
}
function sparkline(series,valkey,color){
  const W=260,H=54,pt=6,pb=6;const ys=series.map(d=>d[valkey]),mn=Math.min(...ys),mx=Math.max(...ys),rng=(mx-mn)||1;
  const x=i=>i/(series.length-1)*W,y=v=>pt+(1-(v-mn)/rng)*(H-pt-pb);
  const line=series.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[valkey]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(series.length-1).toFixed(1)}" cy="${y(ys[ys.length-1]).toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function mixBar(oi){
  const segs=[['Rooms',oi.room_revenue,'var(--accent)'],['F&B',oi.fb_revenue,'var(--warn)'],['Other',oi.ood_revenue,'var(--blue)']];
  const tot=segs.reduce((s,x)=>s+(x[1]||0),0)||1;
  const bar=segs.map(([n,v,c])=>{const p=(v||0)/tot*100;return `<span style="flex:${v||0};background:${c}">${p>10?Math.round(p)+'%':''}</span>`;}).join('');

/* ---------- computed full report for any date (Today + MTD vs last year) ---------- */
function accumulate(list){
  const a={available:0,occupied:0,room_rev:0,fb_rev:0,ood_rev:0,total_rev:0,covers:0,rnl:0,bq:0,ird:0,outlets:{},ood:{}};
  list.forEach(d=>{const oi=d.operating_income;
    a.available+=oi.total_rooms||0;a.occupied+=oi.occupied||0;a.room_rev+=oi.room_revenue||0;
    a.fb_rev+=oi.fb_revenue||0;a.ood_rev+=oi.ood_revenue||0;a.total_rev+=oi.total_hotel_revenue||0;a.covers+=oi.total_covers||0;
    a.rnl+=d.fb_details.total_rnl||0;a.bq+=d.fb_details.banquet_other||0;a.ird+=d.fb_details.ird||0;
    d.outlet_details.forEach(o=>{const x=a.outlets[o.name]=a.outlets[o.name]||{rev:0,cov:0};x.rev+=o.revenue||0;x.cov+=o.covers||0;});
    d.ood.forEach(o=>{a.ood[o.name]=(a.ood[o.name]||0)+(o.revenue||0);});
  });return a;
}
function monthDaysUpTo(y,m,dd){return Object.keys(DATA.days).filter(k=>+k.slice(0,4)===y&&+k.slice(5,7)===m&&+k.slice(8,10)<=dd).map(k=>DATA.days[k]);}
function computedReport(iso){
  const day=DATA.days[iso],y=+iso.slice(0,4),m=+iso.slice(5,7),dd=+iso.slice(8,10),ly=DATA.days[lyIso(iso)];
  const tyT=accumulate([day]),lyT=ly?accumulate([ly]):null,tyM=accumulate(monthDaysUpTo(y,m,dd)),lyM=ly?accumulate(monthDaysUpTo(y-1,m,dd)):null;
  const R=(label,kind,fn)=>({label,kind,today_ty:fn(tyT),today_ly:lyT?fn(lyT):null,mtd_ty:fn(tyM),mtd_ly:lyM?fn(lyM):null});
  const rate=(n,d)=>a=>{const den=d(a);return den?n(a)/den:null;};
  const oi=[R('Total Rooms in Hotel','number',a=>a.available),R('Occupied Rooms','number',a=>a.occupied),
    R('Occupancy (%)','pct',rate(a=>a.occupied,a=>a.available)),R('ADR','currency',rate(a=>a.room_rev,a=>a.occupied)),
    R('RevPar','currency',rate(a=>a.room_rev,a=>a.available)),R('Total Covers','number',a=>a.covers),
    R('Total APC','currency',rate(a=>a.fb_rev,a=>a.covers)),R('Room Revenue','currency',a=>a.room_rev),
    R('F&B Revenue','currency',a=>a.fb_rev),R('OOD Revenue','currency',a=>a.ood_rev),R('Total Hotel Revenue','currency',a=>a.total_rev)];
  const fb=[R('Total RNL','currency',a=>a.rnl),R('Banquet & Other Than F&B','currency',a=>a.bq),R('IRD','currency',a=>a.ird)];
  const outlets=[];day.outlet_details.forEach(o=>{const n=o.name;
    outlets.push(R(n+' - No. of Cvrs','number',a=>a.outlets[n]?a.outlets[n].cov:null));
    outlets.push(R(n+' - Avg. Check/Cvr','currency',a=>{const x=a.outlets[n];return x&&x.cov?x.rev/x.cov:null;}));
    outlets.push(R(n+' - Rev.','currency',a=>a.outlets[n]?a.outlets[n].rev:null));});
  const ood=day.ood.map(o=>R(o.name,'currency',a=>a.ood[o.name]!=null?a.ood[o.name]:null));
  return [{title:'Operating Income',rows:oi},{title:'F&B Details',rows:fb},{title:'Outlet Details',rows:outlets},{title:'Other Operating Departments',rows:ood}];
}

function spark2(series,key,lykey,color){
  const W=210,H=44,pt=5,pb=5,all=[];
  series.forEach(d=>{if(d[key]!=null)all.push(d[key]);if(d[lykey]!=null)all.push(d[lykey]);});
  const mn=Math.min(...all),mx=Math.max(...all),rng=(mx-mn)||1;
  const x=i=>series.length<2?0:i/(series.length-1)*W,y=v=>pt+(1-(v-mn)/rng)*(H-pt-pb);
  const pathFor=k=>{let d='',pen=false;series.forEach((s,i)=>{const v=s[k];if(v==null){pen=false;return;}d+=`${pen?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;pen=true;});return d.trim();};
  const ty=pathFor(key),ly=pathFor(lykey),last=series[series.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="44" style="margin-top:8px">
    ${ly?`<path d="${ly}" fill="none" stroke="#b8c2d4" stroke-width="1.6" stroke-dasharray="4 3"/>`:''}
    <path d="${ty}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    ${last[key]!=null?`<circle cx="${x(series.length-1).toFixed(1)}" cy="${y(last[key]).toFixed(1)}" r="2.8" fill="${color}"/>`:''}</svg>`;
}

  const leg=segs.map(s=>`<span><span class="dot" style="background:${s.c}"></span>${s.n}<b>${Math.round(s.v/tot*100)}%</b></span>`).join('');

  // ===== 3-month pace summary (current month + next 2), editable forecast =====
  let [py,pm]=PTO.slice(0,7).split('-').map(Number);
  const months=[];for(let i=0;i<3;i++){months.push(`${py}-${String(pm).padStart(2,'0')}`);pm++;if(pm>12){pm=1;py++;}}
  function loadFc(ym){try{const v=localStorage.getItem('cyv_fc_'+ym);return v==null?null:+v;}catch(e){return null;}}
  const monthColors=['#2b6cb0','#8a5cc0','#2b6cb0'];
  const paceRows=months.map((ym,i)=>{
    const ks=Object.keys(B).filter(k=>k.slice(0,7)===ym);
    let rT=0,vT=0,occS=0,occN=0,dR=0,dV=0,booked=0;
    ks.forEach(k=>{const b=B[k],a=A[k];rT+=b.r||0;vT+=b.rev||0;if(b.occ!=null){occS+=b.occ;occN++;}if((b.rev||0)>0)booked++;
      if(a){if(b.r!=null&&a.r!=null)dR+=b.r-a.r;if(b.rev!=null&&a.rev!=null)dV+=b.rev-a.rev;}});
    const dim=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
    const proj=booked?Math.round(vT/booked*dim/1e4)*1e4:vT;   // smart default forecast (pace projection)
    const fc=loadFc(ym)!=null?loadFc(ym):proj;
    const occ=occN?occS/occN:null,gap=fc-vT;
    const adrOtb=rT?vT/rT:null;      // ADR on the books = room rev / rooms OTB
    const adrPk=dR?dV/dR:null;       // pick-up ADR = rate the picked-up rooms came in at
    const mName=MONTHS[+ym.slice(5)]+' '+ym.slice(0,4);
    return `<tr>
      <td class="mn" style="color:${monthColors[i]}">${mName}</td>
      <td>${occ==null?'—':(occ*100).toFixed(0)+'%'}</td>
      <td>${num(rT)}</td>
      <td>${adrOtb==null?'—':rs(adrOtb)}</td>
      <td>${rs(vT)}</td>
      <td class="pk${dR<0?' neg':''}">${dR>=0?'+':''}${num(dR)}</td>
      <td class="pk${adrPk!=null&&adrPk<0?' neg':''}">${adrPk==null?'—':rs(adrPk)}</td>
      <td class="pk${dV<0?' neg':''}">${dV>=0?'+':'−'}₹${INR.format(Math.abs(Math.round(dV)))}</td>
      <td><input class="fc-in" type="text" inputmode="numeric" data-ym="${ym}" data-rev="${Math.round(vT)}" value="₹${INR.format(Math.round(fc))}"></td>
      <td class="gap ${gap>=0?'pos':'neg'}" id="gap-${ym}">${gap>=0?'':'−'}₹${INR.format(Math.abs(Math.round(gap)))}</td>
    </tr>`;}).join('');
  const paceHTML=`<div class="snapsec">
    <div class="snaphdr">📊 3-MONTH PACE SUMMARY<span class="sh-sub">Current month +2 · ${months.map(m=>MONTHS[+m.slice(5)]).join(' → ')} ${PTO.slice(0,4)}</span></div>
    <div class="pacewrap"><table class="pace"><thead>
      <tr><th>Month</th><th>Occ %</th><th>Rooms OTB</th><th>ADR OTB</th><th>Room Rev</th><th class="pk">Pickup RNs</th><th class="pk">ADR Pickup</th><th class="pk">Rev Pickup</th><th>Forecast ✎</th><th>Gap to Fcst</th></tr>
    </thead><tbody>${paceRows}</tbody></table>
    <div class="fc-hint">✎ Forecast is yours to set — type your own target for any month and the Gap recalculates instantly (saved on this device). Default is a pace projection. Gap = Forecast − Room Rev on the books.</div></div></div>`;

  view.innerHTML=`
    <div class="summary"><div class="ic">✦</div><div class="tx">Pick-up — on the books at <b>${labelDate(PTO)}</b> vs <b>${labelDate(PFROM)}</b>, by stay date. <b>On the Books</b> = rooms / ADR / revenue as of ${labelDate(PTO).replace(/^\w+, /,'')}. <b>Pick-up</b> = change since ${labelDate(PFROM).replace(/^\w+, /,'')} (pick-up ADR = the rate the new rooms came in at). <b>ADR Δ</b> = ADR change vs the prior snapshot.</div></div>
    ${todayHTML}
    ${paceHTML}
    <div class="pk-legend"><span class="lg-label">Occupancy</span>${OCCBANDS.map(x=>`<span class="lg-item"><i style="background:${x[1]}"></i>${x[2]}</span>`).join('')}</div>
    <div class="pk-grid">${panels||'<div class="err">No overlapping stay dates between the two snapshots.</div>'}</div>`;
  // wire editable forecast → live gap + persistence
  view.querySelectorAll('.fc-in').forEach(inp=>{
    const val=()=>+(inp.value.replace(/[^0-9]/g,''))||0;
    const recompute=()=>{const rev=+inp.dataset.rev,fc=val(),gap=fc-rev,cell=document.getElementById('gap-'+inp.dataset.ym);
      if(cell){cell.textContent=(gap>=0?'':'−')+'₹'+INR.format(Math.abs(Math.round(gap)));cell.className='gap '+(gap>=0?'pos':'neg');}
      try{localStorage.setItem('cyv_fc_'+inp.dataset.ym,String(fc));}catch(e){}};
    inp.addEventListener('input',recompute);
    inp.addEventListener('blur',()=>{inp.value='₹'+INR.format(val());});   // re-format with grouping when done typing
  });
}

function glanceTable(block,title,isChange,chg){
  const grpHead=STRMETRICS.map(m=>`<th colspan="3" class="grp">${m.label}</th>`).join('');
  const subHead=STRMETRICS.map(m=>`<th>My Property</th><th>Comp Set</th><th>Index (${m.idx})</th>`).join('');

function strInsights(g){
  const p=g.perf,c=g.change;
  const mpi=p.occ.cm.idx,ari=p.adr.cm.idx,rgi=p.revpar.cm.idx;
  const pct=v=>v==null?'n/a':(v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%';
  const R=v=>'₹'+INR.format(Math.round(v));
  const driver=(ari>=mpi)?`rate (ARI ${ari.toFixed(1)})`:`occupancy (MPI ${mpi.toFixed(1)})`;
  const summary=`RevPAR index (RGI) ${rgi.toFixed(1)} — the property is earning ${(rgi-100).toFixed(0)}% more RevPAR than its competitive set this month, led by ${driver}. RevPAR ${pct(c.revpar.cm.mp)} YoY vs comp set ${pct(c.revpar.cm.cs)}.`;
  const highlights=[
    {title:`RGI ${rgi.toFixed(1)} — RevPAR ${(rgi-100).toFixed(0)}% above comp set`,detail:`${R(p.revpar.cm.mp)} vs ${R(p.revpar.cm.cs)} comp-set RevPAR.`},
    {title:`ARI ${ari.toFixed(1)} — ADR ${(ari-100).toFixed(0)}% above comp set`,detail:`${R(p.adr.cm.mp)} vs ${R(p.adr.cm.cs)} comp-set ADR.`},
    {title:`RevPAR ${pct(c.revpar.cm.mp)} YoY`,detail:`Comp set ${pct(c.revpar.cm.cs)} · RGI ${pct(c.revpar.cm.idx)} vs last year.`},
  ];
  const watch=[];
  [['MPI',mpi,'occupancy'],['ARI',ari,'rate'],['RGI',rgi,'RevPAR']].forEach(([n,v,w])=>{if(v!=null&&v<100)watch.push({title:`${n} below 100 (${v.toFixed(1)})`,detail:`Trailing the comp set on ${w}.`});});
  if(c.revpar.cm.idx!=null&&c.revpar.cm.idx<0)watch.push({title:`RGI ${pct(c.revpar.cm.idx)} vs last year`,detail:`Comp set grew faster than the property in RevPAR terms this month.`});
  if(!watch.length)watch.push({title:'Ahead of the comp set on every metric',detail:'MPI, ARI and RGI all above 100 this month.'});
  const actions=[];
  if(mpi!=null&&ari!=null&&mpi<ari-10)actions.push({title:'Occupancy index lags rate index',detail:`MPI ${mpi.toFixed(1)} vs ARI ${ari.toFixed(1)} — room to grow occupancy while holding the rate premium.`});
  if(ari!=null&&mpi!=null&&ari<mpi-10)actions.push({title:'Rate index lags occupancy index',detail:`ARI ${ari.toFixed(1)} vs MPI ${mpi.toFixed(1)} — headroom to push ADR given the occupancy strength.`});
  if(c.revpar.cm.cs!=null&&c.revpar.cm.mp!=null&&c.revpar.cm.cs>c.revpar.cm.mp)actions.push({title:'Comp set out-growing you YoY',detail:`Comp RevPAR ${pct(c.revpar.cm.cs)} vs your ${pct(c.revpar.cm.mp)} — watch competitor pricing and pace.`});
  if(!actions.length)actions.push({title:'Hold the premium',detail:'Sustain rate discipline while protecting occupancy; monitor comp-set movements weekly.'});
  return {summary,highlights,watch,action_items:actions};
}

function strChartSVG(tr,n){
  const m=STRTMETRICS[STRTM],both=STRVIEW==='both',chg=STRVIEW==='chg';

  else{const all=[...mpV,...csV].filter(v=>v!=null);lmin=0;lmax=(Math.max(...all)*1.10)||1;}

  const path=(arr,yf)=>{let d='',pen=false;arr.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+x(i).toFixed(1)+','+yf(v).toFixed(1)+' ';pen=true;});return d.trim();};
  let grid='';for(let gI=0;gI<=4;gI++){const gv=lmin+(lmax-lmin)*gI/4,gy=yL(gv);
    grid+=`<line x1="${pl}" y1="${gy.toFixed(1)}" x2="${W-pr}" y2="${gy.toFixed(1)}" stroke="#dbe1e9"/><text x="${pl-7}" y="${(gy+4).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="10">${ltick(gv)}</text>`;

  const zline=v=>`<line x1="${pl}" y1="${v.toFixed(1)}" x2="${W-pr}" y2="${v.toFixed(1)}" stroke="#9aa6b8" stroke-width="1.2"/>`;
  const zero=chg&&lmin<0&&lmax>0?zline(yL(0)):(both&&gmin<0&&gmax>0?zline(yR(0)):'');
  const step=Math.max(1,Math.ceil(months.length/12));
  let xl='';months.forEach((ym,i)=>{if(i%step===0||i===months.length-1)xl+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="var(--faint)" font-size="9.5">${strMonLabel(ym)}</text>`;});
  const dots=(arr,col,yf)=>arr.map((v,i)=>v==null?'':`<circle cx="${x(i).toFixed(1)}" cy="${yf(v).toFixed(1)}" r="2.4" fill="#fff" stroke="${col}" stroke-width="1.6"/>`).join('');
  const hit=months.map((ym,i)=>`<rect x="${(x(i)-(W-pl-pr)/months.length/2).toFixed(1)}" y="${pt}" width="${((W-pl-pr)/months.length).toFixed(1)}" height="${H-pt-pb}" fill="transparent" class="shit" data-i="${i}"/>`).join('');
  // growth lines (both mode) — dashed, on the right axis, distinct colours
  let gline='';

function applyData(d,h,s){
  if(d){
    const prevLatest=DATA?DATA.latest_date:null;
    const wasOnLatest=(PDATE==null||PDATE===prevLatest);
    DATA=d;
    // jump the DBR date to the newest day when we were already on the latest (or the day vanished)
    if(wasOnLatest||!DATA.days[PDATE])PDATE=d.latest_date;
    const st=document.getElementById('stamp');if(st)st.textContent='Updated '+new Date(d.generated_at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const dc=document.getElementById('daycount');if(dc)dc.textContent=Object.keys(d.days).length+' days available';}
  if(h&&h.snaps&&h.dates&&h.dates.length){
    HF=h;
    // Refresh means "show the newest": always advance H&F + Pick-up to the latest snapshot.
    HFSNAP=h.latest;PTO=h.latest;PDAYS=Math.max(1,PDAYS||1);PFROM=snapFrom(PTO,PDAYS);
  }
  if(s){STAR=s;}
  selectTab(TAB);
}

function cyvToast(msg){
  let t=document.getElementById('cyvToast');
  if(!t){t=document.createElement('div');t.id='cyvToast';
    t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16233b;color:#fff;padding:11px 18px;border-radius:10px;font:600 13px/1.35 -apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 6px 22px rgba(0,0,0,.28);z-index:100000;max-width:82vw;text-align:center';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.transition='';t.style.opacity='1';
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.transition='opacity .5s';t.style.opacity='0';},4600);

function setRefreshLabel(txt,spin){
  const btn=document.getElementById('refreshBtn');if(!btn)return;
  btn.innerHTML='<span class="ic'+(spin?' spin':'')+'">↻</span> '+txt;

// Refresh = ask the server to fetch new email now, then wait for the fresh build.
function refreshData(){
  const btn=document.getElementById('refreshBtn');
  if(btn){btn.classList.add('spin');btn.disabled=true;}
  const finish=(msg)=>{if(btn){btn.classList.remove('spin');btn.disabled=false;}setRefreshLabel('Refresh',false);if(msg)cyvToast(msg);};
  const prevGen=DATA?DATA.generated_at:null;
  setRefreshLabel('Fetching…',true);
  fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'}})
    .then(r=>r.json().catch(()=>({ok:false,status:r.status})))
    .then(res=>{
      if(res&&res.ok){
        cyvToast('Fetching the latest reports from email…');
        pollForBuild(prevGen,0,finish);
      }else{
        // trigger endpoint not set up yet — just reload whatever is already built
        reloadDataOnly().then(()=>finish('Showing the latest available data.'));
      }
    })
    .catch(()=>reloadDataOnly().then(()=>finish('Showing the latest available data.')));
}
function pollForBuild(prevGen,tries,finish){
  const MAX=26; // ~3.5 min at 8s intervals
  setRefreshLabel('Fetching… '+(tries*8)+'s',true);
  fetch('./data.json?ts='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null).then(d=>{
    if(d&&d.generated_at&&d.generated_at!==prevGen){
      Promise.all([
        Promise.resolve(d),
        fetch('./hf.json?ts='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
        fetch('./star.json?ts='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
      ]).then(([dd,h,s])=>{applyData(dd,h,s);finish('Updated with the latest reports.');});
      return;
    }
    if(tries>=MAX){reloadDataOnly().then(()=>finish('Still building — showing the latest available. Try Refresh again shortly.'));return;}
    setTimeout(()=>pollForBuild(prevGen,tries+1,finish),8000);
  });
}
