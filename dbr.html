<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DBR · Courtyard Vadodara</title>
<meta name="description" content="Daily Business Report — Courtyard by Marriott Vadodara." />
<style>
  :root{
    --bg:#0f1419;--panel:#161d26;--panel-2:#1c2531;--line:#26303d;--line-soft:#1e2731;
    --text:#e8edf2;--muted:#93a1b0;--faint:#697682;--accent:#b0143c;--accent-soft:#e0577a;
    --ring:rgba(176,20,60,.30);--good:#3fb98a;--bad:#e0577a;--warn:#e0a13c;--blue:#4f9fd0;
    --head:#131a22;--sec:#0e141b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 85% -10%,#1a2330 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:rgba(15,20,25,.65);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
  .bar{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:600}
  .logo{width:33px;height:33px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7a0d29);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;box-shadow:0 4px 14px var(--ring)}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:18px}
  nav a:hover{color:var(--text)}
  .page{padding:26px 0 56px}
  .titlerow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  h1{font-size:23px;font-weight:700;letter-spacing:-.3px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
  .badge.ok{color:var(--good);border-color:#2c6b55}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .sub{color:var(--muted);font-size:13.5px;margin:4px 0 20px}
  .sechead{display:flex;align-items:center;gap:10px;margin:26px 2px 12px}
  .sechead h2{font-size:14px;font-weight:700;letter-spacing:.3px}
  .aichip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--accent),#7a0d29);padding:3px 8px;border-radius:6px;box-shadow:0 2px 10px var(--ring)}

  .hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px}
  @media(max-width:680px){.hero{grid-template-columns:1fr}}
  .hcard{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;padding:15px 18px}
  .hcard.today{border-color:var(--ring);background:linear-gradient(135deg,#241118,#1c2531)}
  .hcard .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:7px}
  .hcard.today .lbl{color:var(--accent-soft)}
  .hcard .v{font-size:23px;font-weight:700;letter-spacing:-.3px}
  .hcard .vs{font-size:12px;color:var(--faint);margin-top:5px}

  /* insights */
  .summary{background:linear-gradient(135deg,#1d1420,#1a222c);border:1px solid var(--ring);border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
  .summary .ic{font-size:18px;line-height:1.3}
  .summary .tx{font-size:14.5px;font-weight:500}
  .icards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.icards{grid-template-columns:1fr}}
  .icard{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .icard .ih{padding:11px 16px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
  .icard.win .ih{color:var(--good)}.icard.watch .ih{color:var(--warn)}.icard.act .ih{color:var(--accent-soft)}
  .icard ul{list-style:none;padding:6px 0}
  .icard li{padding:9px 16px;border-bottom:1px solid var(--line-soft)}
  .icard li:last-child{border-bottom:none}
  .icard li .t{font-size:13px;font-weight:600;margin-bottom:2px}
  .icard li .d{font-size:12px;color:var(--muted)}
  .icard.act li .t::before{content:"→ ";color:var(--accent-soft)}

  .charts{display:grid;grid-template-columns:1fr;gap:14px}
  .crow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px}
  @media(max-width:820px){.crow{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
  svg{display:block;width:100%;height:auto}
  .chartwrap{position:relative}
  .tt{position:absolute;pointer-events:none;background:#0b1016;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;opacity:0;transition:opacity .1s;white-space:nowrap;transform:translate(-50%,-115%);box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .tt b{color:var(--accent-soft)}
  .mix{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .mix span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;min-width:2px}
  .mixleg{display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:13px}
  .mixleg .row{display:flex;align-items:center;gap:9px}
  .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .mixleg .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
  .spark .big{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .spark .cap{font-size:12px;color:var(--faint);margin-top:2px}

  /* today-in-detail */
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .mgrid>div{background:var(--panel);padding:13px 16px}
  .mgrid .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .mgrid .v{font-size:17px;font-weight:600}
  @media(max-width:520px){.mgrid{grid-template-columns:repeat(2,1fr)}}
  .cols2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
  @media(max-width:820px){.cols2{grid-template-columns:1fr}}
  .dcard{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dcard .dh{padding:12px 16px 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  table.dt{width:100%;border-collapse:collapse;font-size:13px}
  table.dt th,table.dt td{padding:9px 16px;text-align:right;border-bottom:1px solid var(--line-soft)}
  table.dt th:first-child,table.dt td:first-child{text-align:left}
  table.dt thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:600}
  table.dt tbody tr:last-child td{border-bottom:none}
  table.dt tr:hover td{background:#182029}
  table.dt td.num{font-variant-numeric:tabular-nums}
  table.dt td.rev{font-weight:600}
  table.dt tr.tot td{background:var(--head);font-weight:700;border-top:1px solid var(--line)}
  .mb{display:inline-block;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent-soft));vertical-align:middle;margin-left:8px;box-shadow:0 0 8px var(--ring)}

  .reportwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel)}
  table.report{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
  table.report th,table.report td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
  table.report thead th{position:sticky;top:0;background:var(--head);z-index:2}
  .grp th{border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent-soft);text-align:center;padding-top:11px}
  .grp th.g-mtd{color:#8fb3d9}.grp th.g-ytd{color:#c7a3e0}
  .subh th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding-bottom:10px}
  th.stick,td.stick{position:sticky;left:0;text-align:left;background:var(--head);z-index:3;min-width:186px;border-right:1px solid var(--line)}
  tbody td.stick{background:var(--panel)}
  tbody tr:hover td{background:#182029}
  tbody tr:hover td.stick{background:#1b232d}
  td.num{font-variant-numeric:tabular-nums}
  tr.sec td{background:var(--sec);color:var(--accent-soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.7px;text-align:left;position:sticky;left:0}
  tr.total td{font-weight:700;background:#1a222c}
  tr.total td.stick{background:#1a222c}
  .var.up{color:var(--good)}.var.down{color:var(--bad)}
  .divg{border-left:1px solid var(--line)}
  footer{border-top:1px solid var(--line);padding:20px 0;color:var(--faint);font-size:12.5px;margin-top:24px}
  .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .err{padding:40px;text-align:center;color:var(--muted)}
  .hint{font-size:12px;color:var(--faint);margin:8px 2px 0}
</style>
</head>
<body data-palette="#b0143c">
<header>
  <div class="wrap bar">
    <div class="brand"><div class="logo">CY</div><div>Courtyard Vadodara<small>Daily Business Report</small></div></div>
    <nav><a href="index.html">&larr; Hub</a></nav>
  </div>
</header>

<main class="wrap page" id="app"><div class="err" id="loading">Loading owner report…</div></main>

<footer><div class="wrap foot"><div>Courtyard by Marriott Vadodara · Managed by NewcrestImage</div><div id="stamp"></div></div></footer>

<script>
const INR=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const rs=v=>v==null?'—':'₹'+INR.format(Math.round(v));
const fmt=(v,kind)=>{if(v==null)return '—';if(kind==='pct')return (v*100).toFixed(1)+'%';if(kind==='number')return INR.format(Math.round(v));return '₹'+INR.format(Math.round(v));};
const vcell=v=>{if(v==null)return '<td class="num">—</td>';const up=v>=0;return `<td class="num var ${up?'up':'down'}">${(up?'+':'')+(v*100).toFixed(0)}%</td>`;};
const MONTHS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const findRow=(d,l)=>{for(const s of d.sections)for(const r of s.rows)if(r.label.startsWith(l))return r;return null;};

function heroCard(cls,title,row,key){
  const ty=row?row[key+'_ty']:null,varr=row?row[key+'_var']:null;let vs='';
  if(varr!=null){const up=varr>=0;vs=`<span style="color:${up?'var(--good)':'var(--bad)'}">${up?'▲':'▼'} ${(Math.abs(varr)*100).toFixed(0)}% vs budget</span>`;}
  return `<div class="hcard ${cls}"><div class="lbl">${title}</div><div class="v">${rs(ty)}</div><div class="vs">${vs}</div></div>`;
}
function insightsBlock(ins){
  if(!ins)return '';
  const li=a=>a.map(x=>`<li><div class="t">${x.title}</div><div class="d">${x.detail}</div></li>`).join('');
  return `
    <div class="sechead"><span class="aichip">✦ AI</span><h2>Insights &amp; Action Items</h2></div>
    <div class="summary"><div class="ic">✦</div><div class="tx">${ins.summary||''}</div></div>
    <div class="icards">
      <div class="icard win"><div class="ih">▲ Highlights</div><ul>${li(ins.highlights)||'<li><div class="d">—</div></li>'}</ul></div>
      <div class="icard watch"><div class="ih">◆ Watch</div><ul>${li(ins.watch)||'<li><div class="d">Nothing notable.</div></li>'}</ul></div>
      <div class="icard act"><div class="ih">✓ Action Items</div><ul>${li(ins.action_items)||'<li><div class="d">No actions flagged.</div></li>'}</ul></div>
    </div>`;
}
function lineChart(series,valkey,color){
  const W=640,H=200,pl=48,pr=12,pt=14,pb=24;
  const ys=series.map(d=>d[valkey]),ymax=Math.max(...ys)*1.08||1;
  const x=i=>pl+(series.length<2?0:i/(series.length-1)*(W-pl-pr));
  const y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const line=series.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[valkey]).toFixed(1)}`).join(' ');
  const area=`${line} L${x(series.length-1).toFixed(1)},${H-pb} L${x(0).toFixed(1)},${H-pb} Z`;
  let grid='';for(let g=0;g<=3;g++){const gv=ymax*g/3,gy=y(gv);grid+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#20293466"/><text x="${pl-7}" y="${gy+4}" text-anchor="end" fill="var(--faint)" font-size="10">${(gv/1e5).toFixed(1)}L</text>`;}
  let xl='';series.forEach((d,i)=>{if(series.length<=16||i%2===0)xl+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" fill="var(--faint)" font-size="10">${d.day}</text>`;});
  const dots=series.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d[valkey]).toFixed(1)}" r="2.6" fill="#0f1419" stroke="${color}" stroke-width="2"/>`).join('');
  const hit=series.map((d,i)=>`<rect x="${(x(i)-(W-pl-pr)/series.length/2).toFixed(1)}" y="${pt}" width="${((W-pl-pr)/series.length).toFixed(1)}" height="${H-pt-pb}" fill="transparent" data-i="${i}" class="hit"/>`).join('');
  return {svg:`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#g1)"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><line id="cr" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="${color}" stroke-dasharray="3 3" opacity="0"/>${dots}${xl}${hit}</svg>`,x,y,W,H};
}
function sparkline(series,valkey,color){
  const W=260,H=54,pt=6,pb=6;
  const ys=series.map(d=>d[valkey]),ymin=Math.min(...ys),ymax=Math.max(...ys),rng=(ymax-ymin)||1;
  const x=i=>i/(series.length-1)*W;
  const y=v=>pt+(1-(v-ymin)/rng)*(H-pt-pb);
  const line=series.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[valkey]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(series.length-1).toFixed(1)}" cy="${y(ys[ys.length-1]).toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function mixBar(mix){
  const segs=[['Rooms',mix.room,'var(--accent)'],['F&B',mix.fb,'var(--warn)'],['Other',mix.ood,'var(--blue)']];
  const tot=segs.reduce((s,x)=>s+(x[1]||0),0)||1;
  const bar=segs.map(([n,v,c])=>{const p=(v||0)/tot*100;return `<span style="flex:${v||0};background:${c}">${p>10?Math.round(p)+'%':''}</span>`;}).join('');
  const leg=segs.map(([n,v,c])=>`<div class="row"><span class="sw" style="background:${c}"></span>${n}<span class="amt">${rs(v)}</span></div>`).join('');
  return `<div class="mix">${bar}</div><div class="mixleg">${leg}</div>`;
}

const OUTLET_NAMES=['812 CE','812 Meal Plan','Brubon Café','MBOW','Baroda Grill (BGC)','IRD','The Deck (Starbucks)','Banquet'];
const secByTitle=(d,t)=>d.sections.find(s=>s.title===t);
const valBy=(sec,lbl)=>{const r=sec&&sec.rows.find(x=>x.label.startsWith(lbl));return r?r.today_ty:null;};
function detailBlock(d){
  const oi=secByTitle(d,'Operating Income'); if(!oi)return '';
  const g=[['Total Rooms',valBy(oi,'Total Rooms in Hotel'),'number'],['Occupied Rooms',valBy(oi,'Occupied Rooms'),'number'],['Occupancy',valBy(oi,'Occupancy'),'pct'],
    ['ADR',valBy(oi,'ADR'),'cur'],['RevPAR',valBy(oi,'RevPar'),'cur'],['Total Covers',valBy(oi,'Total Covers'),'number'],
    ['APC (Avg / Cover)',valBy(oi,'Total APC'),'cur'],['Room Revenue',valBy(oi,'Room Revenue'),'cur'],['F&B Revenue',valBy(oi,'F&B Revenue'),'cur']];
  const grid=g.map(([l,v,k])=>`<div><div class="lbl">${l}</div><div class="v">${k==='pct'?(v==null?'—':(v*100).toFixed(1)+'%'):(k==='number'?(v==null?'—':INR.format(Math.round(v))):rs(v))}</div></div>`).join('');
  // outlets: chunk Outlet Details rows into triplets
  const od=secByTitle(d,'Outlet Details'); const rows=od?od.rows:[];
  const outs=[];for(let i=0;i+2<rows.length;i+=3){outs.push({name:OUTLET_NAMES[i/3]||rows[i+2].label,covers:rows[i].today_ty,avg:rows[i+1].today_ty,rev:rows[i+2].today_ty});}
  const maxRev=Math.max(...outs.map(o=>o.rev||0),1);
  let ob=outs.map(o=>`<tr><td>${o.name}</td><td class="num">${o.covers==null?'—':INR.format(Math.round(o.covers))}</td><td class="num">${rs(o.avg)}</td><td class="num rev">${rs(o.rev)}<span class="mb" style="width:${Math.max(5,(o.rev||0)/maxRev*70)}px"></span></td></tr>`).join('');
  const tRev=outs.reduce((s,o)=>s+(o.rev||0),0),tCov=outs.reduce((s,o)=>s+(o.covers||0),0);
  ob+=`<tr class="tot"><td>Total F&B</td><td class="num">${INR.format(Math.round(tCov))}</td><td></td><td class="num">${rs(tRev)}</td></tr>`;
  // OOD
  const ood=secByTitle(d,'Other Operating Departments');
  const oodRows=(ood?ood.rows:[]).filter(r=>r.kind==='currency'&&(r.today_ty||0)!==0);
  let odb=oodRows.map(r=>`<tr><td>${r.label.replace(/\s*\(.*\)/,'')}</td><td class="num rev">${rs(r.today_ty)}</td></tr>`).join('');
  const tOod=oodRows.reduce((s,r)=>s+(r.today_ty||0),0);
  odb+=`<tr class="tot"><td>Total OOD</td><td class="num">${rs(tOod)}</td></tr>`;
  // F&B split
  const fb=secByTitle(d,'F&B Details');
  const fbb=(fb?fb.rows:[]).map(r=>`<tr><td>${r.label}</td><td class="num rev">${rs(r.today_ty)}</td></tr>`).join('');
  return `
    <div class="sechead"><h2>Today in Detail</h2></div>
    <div class="mgrid">${grid}</div>
    <div class="cols2">
      <div class="dcard"><div class="dh">Outlet Details — covers · avg check · revenue</div>
        <table class="dt"><thead><tr><th>Outlet</th><th>Covers</th><th>Avg Check</th><th>Revenue</th></tr></thead><tbody>${ob}</tbody></table></div>
      <div>
        <div class="dcard"><div class="dh">Other Operating Departments</div>
          <table class="dt"><tbody>${odb}</tbody></table></div>
        <div class="dcard" style="margin-top:16px"><div class="dh">F&B Split</div>
          <table class="dt"><tbody>${fbb}</tbody></table></div>
      </div>
    </div>`;
}

function render(d){
  const tot=findRow(d,'Total Hotel Revenue');
  const dateStr=(d.report_date||'').replace(',',', ');
  const tr=d.daily_trend||[];
  const chart=tr.length?lineChart(tr,'total','var(--accent)'):null;
  document.getElementById('app').innerHTML=`
    <div class="titlerow"><h1>Daily Business Report</h1><span class="badge ok"><span class="dot"></span>Owner Report · Reconciled</span></div>
    <div class="sub">${dateStr} &nbsp;·&nbsp; ${d.property}</div>
    <div class="hero">
      ${heroCard('today','Total Hotel Revenue — Today',tot,'today')}
      ${heroCard('','Month to Date',tot,'mtd')}
      ${heroCard('','Year to Date',tot,'ytd')}
    </div>

    ${insightsBlock(d.insights)}

    <div class="sechead"><h2>Charts</h2></div>
    <div class="charts">
      ${chart?`<div class="card"><h3>Total Revenue — Month to Date</h3><div class="chartwrap" id="cw">${chart.svg}<div class="tt" id="tt"></div></div></div>`:''}
      <div class="crow">
        <div class="card"><h3>Revenue Mix — Today</h3>${mixBar(d.revenue_mix||{})}</div>
        <div class="card spark"><h3>Occupancy — MTD</h3><div class="big">${tr.length?(tr[tr.length-1].occupancy*100).toFixed(0)+'%':'—'}</div><div class="cap">latest of ${tr.length} days</div>${tr.length?sparkline(tr,'occupancy','var(--good)'):''}</div>
        <div class="card spark"><h3>ADR — MTD</h3><div class="big">${tr.length?rs(tr[tr.length-1].adr):'—'}</div><div class="cap">latest of ${tr.length} days</div>${tr.length?sparkline(tr,'adr','var(--blue)'):''}</div>
      </div>
    </div>

    ${detailBlock(d)}

    <div class="sechead"><h2>Full Owner Report</h2></div>
    <div class="reportwrap">
      <table class="report">
        <thead>
          <tr class="grp"><th class="stick" rowspan="2">Line Item</th><th colspan="3">Today</th><th colspan="4" class="g-mtd divg">Month to Date</th><th colspan="4" class="g-ytd divg">Year to Date</th></tr>
          <tr class="subh"><th>Actual</th><th>Budget</th><th>Var</th><th class="divg">Actual</th><th>Last Yr</th><th>Budget</th><th>Var</th><th class="divg">Actual</th><th>Last Yr</th><th>Budget</th><th>Var</th></tr>
        </thead>
        <tbody>${d.sections.map(sectionRows).join('')}</tbody>
      </table>
    </div>
    <div class="hint">Scroll the table sideways for Month-to-Date and Year-to-Date. Variance is vs budget (green above, pink below).</div>`;
  document.getElementById('stamp').textContent='Updated '+new Date(d.generated_at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  if(chart){
    const cw=document.getElementById('cw'),tt=document.getElementById('tt'),svg=cw.querySelector('svg'),cr=svg.querySelector('#cr'),vb=svg.viewBox.baseVal;
    cw.querySelectorAll('.hit').forEach(h=>h.addEventListener('mouseenter',()=>{
      const i=+h.dataset.i,dd=tr[i],px=chart.x(i),py=chart.y(dd.total),rect=cw.getBoundingClientRect();
      cr.setAttribute('x1',px);cr.setAttribute('x2',px);cr.setAttribute('opacity','1');
      tt.style.left=(px/vb.width*rect.width)+'px';tt.style.top=(py/vb.height*rect.height)+'px';tt.style.opacity='1';
      tt.innerHTML=`${MONTHS[dd.month]} ${dd.day} · <b>${rs(dd.total)}</b><br>Occ ${(dd.occupancy*100).toFixed(0)}% · ADR ${rs(dd.adr)}`;
    }));
    cw.addEventListener('mouseleave',()=>{tt.style.opacity='0';cr.setAttribute('opacity','0');});
  }
}
function sectionRows(s){
  let out=`<tr class="sec"><td colspan="12">${s.title}</td></tr>`;
  out+=s.rows.map(r=>{const k=r.kind,isTot=/Total Hotel Revenue/.test(r.label);
    return `<tr class="${isTot?'total':''}"><td class="stick">${r.label}</td>
      <td class="num">${fmt(r.today_ty,k)}</td><td class="num">${fmt(r.today_bud,k)}</td>${vcell(r.today_var)}
      <td class="num divg">${fmt(r.mtd_ty,k)}</td><td class="num">${fmt(r.mtd_ly,k)}</td><td class="num">${fmt(r.mtd_bud,k)}</td>${vcell(r.mtd_var)}
      <td class="num divg">${fmt(r.ytd_ty,k)}</td><td class="num">${fmt(r.ytd_ly,k)}</td><td class="num">${fmt(r.ytd_bud,k)}</td>${vcell(r.ytd_var)}</tr>`;
  }).join('');
  return out;
}
fetch('./data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render)
  .catch(()=>{document.getElementById('app').innerHTML='<div class="err">No report data yet. The daily automation will publish figures here once reports are received.</div>';});
</script>
</body>
</html>
