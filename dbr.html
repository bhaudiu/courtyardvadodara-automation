<!DOCTYPE html>
<html lang="en">
<head>

<title>DBR · Courtyard Vadodara</title>

<style>
  :root{--bg:#0f1419;--panel:#161d26;--panel-2:#1c2531;--line:#26303d;--line-soft:#1e2731;

  </div>

<main class="wrap page" id="app"><div class="err" id="loading">Loading report…</div></main>

<footer><div class="wrap foot"><div>Courtyard by Marriott Vadodara · Managed by NewcrestImage</div><div id="stamp"></div></div></footer>

<script>
const INR=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const INR2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const rs=v=>v==null?'—':'₹'+INR.format(Math.round(v));
const num=v=>v==null?'—':INR.format(Math.round(v));
const MONTHS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let DATA=null;

function dObj(iso){return new Date(iso+'T00:00:00');}
function labelDate(iso){const d=dObj(iso);return `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()+1]} ${d.getFullYear()}`;}
function lyIso(iso){return (parseInt(iso.slice(0,4))-1)+iso.slice(4);}
function pctStr(p){return (p>=0?'+':'')+(p*100).toFixed(0)+'%';}

/* ---------- insights ---------- */
function ACTION(label){
  const l=label.toLowerCase();
  if(/banquet|bqts/.test(l))return 'Push the banquet & events pipeline — confirm tentative bookings.';
  if(/bgc|baroda/.test(l))return 'Review Baroda Grill covers, footfall and pricing.';
  if(/deck|starbucks/.test(l))return 'Lift The Deck footfall with a promotion.';
  if(/brubon/.test(l))return 'Drive Brubon covers with a daypart offer.';
  if(/transport/.test(l))return 'Check transport-desk usage and tie-ups.';
  return 'Review pricing, covers and promotions to close the gap.';
}
function dayInsights(iso){
  const cur=DATA.days[iso]; const ly=DATA.days[lyIso(iso)];
  const oi=cur.operating_income;
  if(!ly){
    const tops=[...cur.outlet_details].filter(o=>o.revenue).sort((a,b)=>b.revenue-a.revenue).slice(0,3);
    return {summary:`Total hotel revenue ${rs(oi.total_hotel_revenue)} · occupancy ${(oi.occupancy*100).toFixed(0)}% · ADR ${rs(oi.adr)}.`,
      highlights:tops.map(o=>({title:`${o.name} — ${rs(o.revenue)}`,detail:`${num(o.covers)} covers · avg ${rs(o.avg_check)}`})),
      watch:[],action_items:[]};
  }
  const lyoi=ly.operating_income;
  const items=[];
  cur.outlet_details.forEach(o=>{const l=ly.outlet_details.find(x=>x.name===o.name);if(l&&o.revenue!=null&&l.revenue!=null)items.push({name:o.name,cur:o.revenue,ly:l.revenue});});
  cur.ood.forEach(o=>{const l=ly.ood.find(x=>x.name===o.name);if(l&&o.revenue!=null&&l.revenue!=null)items.push({name:o.name,cur:o.revenue,ly:l.revenue});});
  items.forEach(i=>{i.delta=i.cur-i.ly;i.pct=i.ly?i.delta/Math.abs(i.ly):null;});
  const MAT=8000;
  const wins=items.filter(i=>i.delta>=MAT).sort((a,b)=>b.delta-a.delta).slice(0,3);
  const cons=items.filter(i=>i.delta<=-MAT).sort((a,b)=>a.delta-b.delta).slice(0,3);
  const totDelta=oi.total_hotel_revenue-lyoi.total_hotel_revenue;
  const totPct=lyoi.total_hotel_revenue?totDelta/lyoi.total_hotel_revenue:0;
  const tone=totPct>=0.03?'Ahead of last year':(totPct<=-0.03?'Behind last year':'In line with last year');
  const drivers=wins.slice(0,2).map(w=>w.name).join(', ');
  return {
    summary:`${tone} — total hotel revenue ${rs(oi.total_hotel_revenue)}, ${pctStr(totPct)} vs same day 2025`+(drivers?`, led by ${drivers}.`:'.'),
    highlights:[{title:`Total revenue ${pctStr(totPct)} YoY`,detail:`${rs(oi.total_hotel_revenue)} vs ${rs(lyoi.total_hotel_revenue)} last year.`}]
      .concat(wins.map(w=>({title:`${w.name} up ${rs(w.delta)} YoY`,detail:`${rs(w.cur)} vs ${rs(w.ly)} (${pctStr(w.pct)}).`}))),
    watch:cons.map(c=>({title:`${c.name} ${pctStr(c.pct)} YoY`,detail:`${rs(c.cur)} vs ${rs(c.ly)} last year (${rs(-c.delta)} lower).`})),
    action_items:cons.map(c=>({title:`${c.name}: ${rs(-c.delta)} behind last year`,detail:ACTION(c.name)})),
  };
}

/* ---------- charts ---------- */
function budFromReport(day,label){const r=day.report;if(!r)return null;for(const s of r)for(const row of s.rows)if(row.label&&row.label.indexOf(label)===0)return row.today_bud;return null;}
function oodRev(day,name){const o=(day.ood||[]).find(x=>x.name===name);return o?o.revenue:null;}
function fbv(day,key){return day.fb_details?day.fb_details[key]:null;}
const METRICS={
  total:{key:'total_hotel_revenue',ly:'ly_total',bud:'bud_total',label:'Total',title:'Total Revenue'},
  room:{key:'room_revenue',ly:'ly_room',bud:'bud_room',label:'Room',title:'Room Revenue'},
  fb:{key:'fb_revenue',ly:'ly_fb',bud:'bud_fb',label:'F&B',title:'F&B Revenue'},
  rnl:{key:'rnl',ly:'ly_rnl',bud:'bud_rnl',label:'812 CE Rest.',title:'812 CE Restaurant (RNL)'},
  banq:{key:'banq',ly:'ly_banq',bud:'bud_banq',label:'Banquet',title:'Banquet Revenue'},
  wine:{key:'wine',ly:'ly_wine',bud:'bud_wine',label:'Wine Shop',title:'Wine Shop Revenue'},
  spa:{key:'spa',ly:'ly_spa',bud:'bud_spa',label:'Spa',title:'Spa Revenue'},
};
let SELMETRIC='total';
function monthSeries(iso){
  const pre=iso.slice(0,7);

    .map(k=>{const day=DATA.days[k],lyk=lyIso(k),lyDay=DATA.days[lyk]||null,lyd=lyDay?lyDay.operating_income:null;
      return {iso:k,day:dObj(k).getDate(),...day.operating_income,
        rnl:fbv(day,'total_rnl'), banq:fbv(day,'banquet_other'),
        wine:oodRev(day,'Wine Shop'), spa:oodRev(day,'Spa'),
        ly_total:lyd?lyd.total_hotel_revenue:null, ly_room:lyd?lyd.room_revenue:null,
        ly_fb:lyd?lyd.fb_revenue:null,
        ly_rnl:lyDay?fbv(lyDay,'total_rnl'):null, ly_banq:lyDay?fbv(lyDay,'banquet_other'):null,
        ly_wine:lyDay?oodRev(lyDay,'Wine Shop'):null, ly_spa:lyDay?oodRev(lyDay,'Spa'):null,
        bud_total:budFromReport(day,'Total Hotel Revenue'), bud_room:budFromReport(day,'Room Revenue'),
        bud_fb:budFromReport(day,'F&B Revenue'), bud_rnl:budFromReport(day,'Total RNL'),
        bud_banq:budFromReport(day,'Banquet & Other Than F&B'),
        bud_wine:budFromReport(day,'Wine Shop'), bud_spa:budFromReport(day,'Spa')};});
}
const CLR_LY='#4f9fd0',CLR_BUD='#c99a3f';
function lineChart(series,m,color,selDay){
  const W=640,H=200,pl=48,pr=12,pt=14,pb=24;
  const allv=[];series.forEach(d=>{if(d[m.key]!=null)allv.push(d[m.key]);if(d[m.ly]!=null)allv.push(d[m.ly]);if(d[m.bud]!=null)allv.push(d[m.bud]);});
  const ymax=Math.max(...allv)*1.08||1;
  const x=i=>pl+(series.length<2?0:i/(series.length-1)*(W-pl-pr));
  const y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const pathFor=key=>{let d='',pen=false;series.forEach((s,i)=>{const v=s[key];if(v==null){pen=false;return;}d+=`${pen?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;pen=true;});return d.trim();};
  const line=pathFor(m.key);
  const area=`${line} L${x(series.length-1).toFixed(1)},${H-pb} L${x(0).toFixed(1)},${H-pb} Z`;
  const budPath=pathFor(m.bud),lyPath=pathFor(m.ly);
  let grid='';for(let g=0;g<=3;g++){const gv=ymax*g/3,gy=y(gv);grid+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#20293466"/><text x="${pl-7}" y="${gy+4}" text-anchor="end" fill="var(--faint)" font-size="10">${(gv/1e5).toFixed(1)}L</text>`;}
  let xl='';series.forEach((d,i)=>{if(series.length<=16||i%2===0)xl+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" fill="${d.day===selDay?'var(--accent-soft)':'var(--faint)'}" font-size="10" font-weight="${d.day===selDay?'700':'400'}">${d.day}</text>`;});
  const dots=series.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d[m.key]).toFixed(1)}" r="${d.day===selDay?4.5:2.6}" fill="${d.day===selDay?'var(--accent-soft)':'#0f1419'}" stroke="${color}" stroke-width="2"/>`).join('');
  const hit=series.map((d,i)=>`<rect x="${(x(i)-(W-pl-pr)/series.length/2).toFixed(1)}" y="${pt}" width="${((W-pl-pr)/series.length).toFixed(1)}" height="${H-pt-pb}" fill="transparent" data-i="${i}" class="hit"/>`).join('');
  const svg=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#g1)"/>`
    +(budPath?`<path d="${budPath}" fill="none" stroke="${CLR_BUD}" stroke-width="1.7" stroke-dasharray="5 4" opacity="0.95"/>`:'')
    +(lyPath?`<path d="${lyPath}" fill="none" stroke="${CLR_LY}" stroke-width="1.9" opacity="0.92"/>`:'')
    +`<path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/><line id="cr" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="${color}" stroke-dasharray="3 3" opacity="0"/>${dots}${xl}${hit}</svg>`;
  return {svg,x,y,W,H,series};
}
function sparkline(series,valkey,color){
  const W=260,H=54,pt=6,pb=6;const ys=series.map(d=>d[valkey]),mn=Math.min(...ys),mx=Math.max(...ys),rng=(mx-mn)||1;
  const x=i=>i/(series.length-1)*W,y=v=>pt+(1-(v-mn)/rng)*(H-pt-pb);
  const line=series.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[valkey]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(series.length-1).toFixed(1)}" cy="${y(ys[ys.length-1]).toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function mixBar(oi){
  const segs=[['Rooms',oi.room_revenue,'var(--accent)'],['F&B',oi.fb_revenue,'var(--warn)'],['Other',oi.ood_revenue,'var(--blue)']];
  const tot=segs.reduce((s,x)=>s+(x[1]||0),0)||1;
  const bar=segs.map(([n,v,c])=>{const p=(v||0)/tot*100;return `<span style="flex:${v||0};background:${c}">${p>10?Math.round(p)+'%':''}</span>`;}).join('');
  const leg=segs.map(([n,v,c])=>`<div class="row"><span class="sw" style="background:${c}"></span>${n}<span class="amt">${rs(v)}</span></div>`).join('');
  return `<div class="mix">${bar}</div><div class="mixleg">${leg}</div>`;
}

/* ---------- detail ---------- */
function detailBlock(day){
  const oi=day.operating_income;
  const g=[['Total Rooms',num(oi.total_rooms)],['Occupied Rooms',num(oi.occupied)],['Occupancy',oi.occupancy==null?'—':(oi.occupancy*100).toFixed(1)+'%'],
    ['ADR',rs(oi.adr)],['RevPAR',rs(oi.revpar)],['Total Covers',num(oi.total_covers)],
    ['APC (Avg / Cover)',rs(oi.apc)],['Room Revenue',rs(oi.room_revenue)],['F&B Revenue',rs(oi.fb_revenue)]];
  const grid=g.map(([l,v])=>`<div><div class="lbl">${l}</div><div class="v">${v}</div></div>`).join('');
  const outs=day.outlet_details;const maxRev=Math.max(...outs.map(o=>o.revenue||0),1);
  let ob=outs.map(o=>`<tr><td>${o.name}</td><td class="num">${o.covers==null?'—':num(o.covers)}</td><td class="num">${rs(o.avg_check)}</td><td class="num rev">${rs(o.revenue)}<span class="mb" style="width:${Math.max(5,(o.revenue||0)/maxRev*70)}px"></span></td></tr>`).join('');
  const tRev=outs.reduce((s,o)=>s+(o.revenue||0),0),tCov=outs.reduce((s,o)=>s+(o.covers||0),0);
  ob+=`<tr class="tot"><td>Total F&B</td><td class="num">${num(tCov)}</td><td></td><td class="num">${rs(tRev)}</td></tr>`;
  const oodRows=day.ood.filter(r=>(r.revenue||0)!==0);
  let odb=oodRows.map(r=>`<tr><td>${r.name.replace(/\s*\(.*\)/,'')}</td><td class="num rev">${rs(r.revenue)}</td></tr>`).join('');
  odb+=`<tr class="tot"><td>Total OOD</td><td class="num">${rs(oodRows.reduce((s,r)=>s+(r.revenue||0),0))}</td></tr>`;
  const fb=day.fb_details;
  const fbb=`<tr><td>Restaurants &amp; Lounge (RNL)</td><td class="num rev">${rs(fb.total_rnl)}</td></tr><tr><td>Banquet</td><td class="num rev">${rs(fb.banquet_other)}</td></tr><tr><td>In-Room Dining (IRD)</td><td class="num rev">${rs(fb.ird)}</td></tr>`;
  return `<div class="sechead"><h2>Day in Detail</h2></div>
    <div class="mgrid">${grid}</div>
    <div class="cols2">
      <div class="dcard"><div class="dh">Outlet Details — covers · avg check · revenue</div>
        <table class="dt"><thead><tr><th>Outlet</th><th>Covers</th><th>Avg Check</th><th>Revenue</th></tr></thead><tbody>${ob}</tbody></table></div>
      <div>
        <div class="dcard"><div class="dh">Other Operating Departments</div><table class="dt"><tbody>${odb}</tbody></table></div>
        <div class="dcard" style="margin-top:16px"><div class="dh">F&B Split</div><table class="dt"><tbody>${fbb}</tbody></table></div>
      </div>
    </div>`;
}

/* ---------- owner report table (latest only) ---------- */
const fmtR=(v,k)=>{if(v==null)return '—';if(k==='pct')return (v*100).toFixed(1)+'%';if(k==='number')return INR.format(Math.round(v));return '₹'+INR.format(Math.round(v));};
const vcell=v=>{if(v==null)return '<td class="num">—</td>';const up=v>=0;return `<td class="num var ${up?'up':'down'}">${(up?'+':'')+(v*100).toFixed(0)}%</td>`;};
function ownerTable(sections){
  const body=sections.map(s=>{
    let out=`<tr class="sec"><td colspan="12">${s.title}</td></tr>`;
    out+=s.rows.map(r=>{const k=r.kind,isTot=/Total Hotel Revenue/.test(r.label);
      return `<tr class="${isTot?'total':''}"><td class="stick">${r.label}</td>
        <td class="num">${fmtR(r.today_ty,k)}</td><td class="num">${fmtR(r.today_bud,k)}</td>${vcell(r.today_var)}
        <td class="num divg">${fmtR(r.mtd_ty,k)}</td><td class="num">${fmtR(r.mtd_ly,k)}</td><td class="num">${fmtR(r.mtd_bud,k)}</td>${vcell(r.mtd_var)}
        <td class="num divg">${fmtR(r.ytd_ty,k)}</td><td class="num">${fmtR(r.ytd_ly,k)}</td><td class="num">${fmtR(r.ytd_bud,k)}</td>${vcell(r.ytd_var)}</tr>`;}).join('');
    return out;}).join('');
  return `<div class="sechead"><h2>Full Owner Report</h2><span class="note">Today vs Budget · MTD &amp; YTD vs Last Year and Budget</span></div>
    <div class="reportwrap"><table class="report"><thead>
      <tr class="grp"><th class="stick" rowspan="2">Line Item</th><th colspan="3">Today</th><th colspan="4" class="g-mtd divg">Month to Date</th><th colspan="4" class="g-ytd divg">Year to Date</th></tr>
      <tr class="subh"><th>Actual</th><th>Budget</th><th>Var</th><th class="divg">Actual</th><th>Last Yr</th><th>Budget</th><th>Var</th><th class="divg">Actual</th><th>Last Yr</th><th>Budget</th><th>Var</th></tr>
    </thead><tbody>${body}</tbody></table></div>
    <div class="hint">Scroll sideways for Month-to-Date and Year-to-Date. Variance vs budget (green above, pink below).</div>`;
}

/* ---------- computed full report for any date (Today + MTD vs last year) ---------- */
function accumulate(list){
  const a={available:0,occupied:0,room_rev:0,fb_rev:0,ood_rev:0,total_rev:0,covers:0,rnl:0,bq:0,ird:0,outlets:{},ood:{}};
  list.forEach(d=>{const oi=d.operating_income;
    a.available+=oi.total_rooms||0;a.occupied+=oi.occupied||0;a.room_rev+=oi.room_revenue||0;
    a.fb_rev+=oi.fb_revenue||0;a.ood_rev+=oi.ood_revenue||0;a.total_rev+=oi.total_hotel_revenue||0;a.covers+=oi.total_covers||0;
    a.rnl+=d.fb_details.total_rnl||0;a.bq+=d.fb_details.banquet_other||0;a.ird+=d.fb_details.ird||0;
    d.outlet_details.forEach(o=>{const x=a.outlets[o.name]=a.outlets[o.name]||{rev:0,cov:0};x.rev+=o.revenue||0;x.cov+=o.covers||0;});
    d.ood.forEach(o=>{a.ood[o.name]=(a.ood[o.name]||0)+(o.revenue||0);});
  });return a;
}
function monthDaysUpTo(y,m,dd){return Object.keys(DATA.days).filter(k=>+k.slice(0,4)===y&&+k.slice(5,7)===m&&+k.slice(8,10)<=dd).map(k=>DATA.days[k]);}
function computedReport(iso){
  const day=DATA.days[iso],y=+iso.slice(0,4),m=+iso.slice(5,7),dd=+iso.slice(8,10),ly=DATA.days[lyIso(iso)];
  const tyT=accumulate([day]),lyT=ly?accumulate([ly]):null,tyM=accumulate(monthDaysUpTo(y,m,dd)),lyM=ly?accumulate(monthDaysUpTo(y-1,m,dd)):null;
  const R=(label,kind,fn)=>({label,kind,today_ty:fn(tyT),today_ly:lyT?fn(lyT):null,mtd_ty:fn(tyM),mtd_ly:lyM?fn(lyM):null});
  const rate=(n,d)=>a=>{const den=d(a);return den?n(a)/den:null;};
  const oi=[R('Total Rooms in Hotel','number',a=>a.available),R('Occupied Rooms','number',a=>a.occupied),
    R('Occupancy (%)','pct',rate(a=>a.occupied,a=>a.available)),R('ADR','currency',rate(a=>a.room_rev,a=>a.occupied)),
    R('RevPar','currency',rate(a=>a.room_rev,a=>a.available)),R('Total Covers','number',a=>a.covers),
    R('Total APC','currency',rate(a=>a.fb_rev,a=>a.covers)),R('Room Revenue','currency',a=>a.room_rev),
    R('F&B Revenue','currency',a=>a.fb_rev),R('OOD Revenue','currency',a=>a.ood_rev),R('Total Hotel Revenue','currency',a=>a.total_rev)];
  const fb=[R('Total RNL','currency',a=>a.rnl),R('Banquet & Other Than F&B','currency',a=>a.bq),R('IRD','currency',a=>a.ird)];
  const outlets=[];day.outlet_details.forEach(o=>{const n=o.name;
    outlets.push(R(n+' - No. of Cvrs','number',a=>a.outlets[n]?a.outlets[n].cov:null));
    outlets.push(R(n+' - Avg. Check/Cvr','currency',a=>{const x=a.outlets[n];return x&&x.cov?x.rev/x.cov:null;}));
    outlets.push(R(n+' - Rev.','currency',a=>a.outlets[n]?a.outlets[n].rev:null));});
  const ood=day.ood.map(o=>R(o.name,'currency',a=>a.ood[o.name]!=null?a.ood[o.name]:null));
  return [{title:'Operating Income',rows:oi},{title:'F&B Details',rows:fb},{title:'Outlet Details',rows:outlets},{title:'Other Operating Departments',rows:ood}];
}
function ownerTableComputed(sections){
  const vc=(ty,ly)=>{if(ty==null||ly==null||ly===0)return '<td class="num">—</td>';const p=(ty-ly)/Math.abs(ly),up=p>=0;return `<td class="num var ${up?'up':'down'}">${(up?'+':'')+(p*100).toFixed(0)}%</td>`;};
  const body=sections.map(s=>{
    let out=`<tr class="sec"><td colspan="7">${s.title}</td></tr>`;
    out+=s.rows.map(r=>{const k=r.kind,isTot=/Total Hotel Revenue/.test(r.label);
      return `<tr class="${isTot?'total':''}"><td class="stick">${r.label}</td>
        <td class="num">${fmtR(r.today_ty,k)}</td><td class="num">${fmtR(r.today_ly,k)}</td>${vc(r.today_ty,r.today_ly)}
        <td class="num divg">${fmtR(r.mtd_ty,k)}</td><td class="num">${fmtR(r.mtd_ly,k)}</td>${vc(r.mtd_ty,r.mtd_ly)}</tr>`;}).join('');
    return out;}).join('');
  return `<div class="sechead"><h2>Full Owner Report</h2><span class="note">Today &amp; Month-to-Date vs same period last year</span></div>
    <div class="reportwrap"><table class="report" style="min-width:720px"><thead>
      <tr class="grp"><th class="stick" rowspan="2">Line Item</th><th colspan="3">Today</th><th colspan="3" class="g-mtd divg">Month to Date</th></tr>
      <tr class="subh"><th>Actual</th><th>Last Yr</th><th>Var</th><th class="divg">Actual</th><th>Last Yr</th><th>Var</th></tr>
    </thead><tbody>${body}</tbody></table></div>
    <div class="hint">Budget and Year-to-Date columns appear on the latest reporting day (from the live sheet). For earlier days this compares to the same period last year.</div>`;
}

function drawChart(iso,series){

  const mo=MONTHS[dObj(iso).getMonth()+1],yr=dObj(iso).getFullYear();

  const btns=Object.keys(METRICS).map(k=>`<button class="cbtn${k===SELMETRIC?' on':''}" data-m="${k}">${METRICS[k].label}</button>`).join('');
  document.getElementById('revchart').innerHTML=`<div class="card">
    <div class="chhead"><h3>${m.title} — ${mo} ${yr}</h3><div class="cbtns">${btns}</div></div>
    <div class="chartwrap" id="cw">${chart.svg}<div class="tt" id="tt"></div></div>
    <div class="chleg"><span style="color:var(--accent-soft)"><i></i>This Year</span><span style="color:${CLR_LY}"><i></i>Last Year</span><span style="color:${CLR_BUD}"><i class="dash"></i>Budget</span></div></div>`;
  document.querySelectorAll('#revchart .cbtn').forEach(b=>b.onclick=()=>{SELMETRIC=b.dataset.m;drawChart(iso,series);});
  const cw=document.getElementById('cw'),tt=document.getElementById('tt'),svg=cw.querySelector('svg'),cr=svg.querySelector('#cr'),vb=svg.viewBox.baseVal;
  cw.querySelectorAll('.hit').forEach(h=>h.addEventListener('mouseenter',()=>{
    const i=+h.dataset.i,dd=series[i],px=chart.x(i),py=chart.y(dd[m.key]),rect=cw.getBoundingClientRect();
    cr.setAttribute('x1',px);cr.setAttribute('x2',px);cr.setAttribute('opacity','1');

      +(dd[m.ly]!=null?`<br><span style="color:${CLR_LY}">LY ${rs(dd[m.ly])}</span>`:'')
      +(dd[m.bud]!=null?`<br><span style="color:${CLR_BUD}">Budget ${rs(dd[m.bud])}</span>`:'');
  }));
  cw.addEventListener('mouseleave',()=>{tt.style.opacity='0';cr.setAttribute('opacity','0');});
}
/* ---------- H&F + Pick-up ---------- */
function dateOptionsHTML(){
  const dates=Object.keys(DATA.days).sort().reverse();
  const y26=dates.filter(x=>x.startsWith('2026')),y25=dates.filter(x=>x.startsWith('2025'));

const sgnR=v=>v==null?'—':(v>=0?'+':'−')+'₹'+INR.format(Math.round(Math.abs(v)));

function hfMetrics(iso){const oi=DATA.days[iso].operating_income;

function isoMinus(iso,n){const d=dObj(iso);d.setDate(d.getDate()-n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function pickupBase(iso,n){

  const earlier=Object.keys(DATA.days).filter(k=>k<iso).sort();
  if(!earlier.length)return null;
  const base=earlier[earlier.length-1];

function snapBase(snap,n){
  const target=isoMinus(snap,n);
  if(HF.snaps[target])return {iso:target,exact:true,gap:n};
  const earlier=HF.dates.filter(d=>d<snap);
  if(!earlier.length)return null;
  const iso=earlier[earlier.length-1];
  return {iso,exact:false,gap:Math.round((dObj(snap)-dObj(iso))/86400000)};
}
const PMETRICS={
  rooms:{f:d=>d.r, fmt:v=>v==null?'—':num(v), label:'Rooms'},
  rev:{f:d=>d.rev, fmt:v=>v==null?'—':rs(v), label:'Revenue'},
  adr:{f:d=>d.adr, fmt:v=>v==null?'—':rs(v), label:'ADR'},
};
const OCCBANDS=[[25,'#c34a3f','0–25%'],[50,'#d3893a','25–50%'],[75,'#a9bb3e','50–75%'],[90,'#46a765','75–90%'],[101,'#1f7a44','90–100%']];
function occColor(o){if(o==null)return 'transparent';const p=o*100;for(const [lim,c] of OCCBANDS){if(p<lim)return c;}return '#1f7a44';}
function occCell(o){if(o==null)return '<td class="occ">—</td>';const p=o*100;return `<td class="occ"><div class="occbar"><div class="occfill" style="width:${Math.min(100,Math.max(0,p)).toFixed(0)}%;background:${occColor(o)}"></div><span>${p.toFixed(0)}%</span></div></td>`;}
function snapFrom(toIso,n){
  if(!HF)return toIso;
  const target=isoMinus(toIso,n);
  if(HF.snaps[target])return target;
  const earlier=HF.dates.filter(d=>d<toIso);
  if(!earlier.length)return toIso;
  let best=earlier[0],bd=Infinity;
  earlier.forEach(d=>{const diff=Math.abs(dObj(d)-dObj(target));if(diff<bd){bd=diff;best=d;}});
  return best;
}
function renderPickup(){

  const byMonth={};stays.forEach(k=>{(byMonth[k.slice(0,7)]=byMonth[k.slice(0,7)]||[]).push(k);});

      const dR=(b.r!=null&&a.r!=null)?b.r-a.r:null;

    const dRt=rT-rF,dVt=vT-vF,bF=rF?vF/rF:null,bT=rT?vT/rT:null,adrPkt=dRt?dVt/dRt:null,adrChgt=(bF!=null&&bT!=null)?bT-bF:null;
    const avgOcc=occN?occSum/occN:null;

    }else{
      const rphrase=dRt>=0?`picked up <b>${num(dRt)}</b> room-night${dRt===1?'':'s'}`:`gave back <b>${num(-dRt)}</b> room-night${dRt===-1?'':'s'}`;

      const best=bd?` Strongest day was ${String(dObj(bd.iso).getDate()).padStart(2,'0')}/${ym.slice(5)} (${sgnN(bd.dR)} rooms${bd.dV!=null?', '+sgnR(bd.dV):''}).`:'';

    }

    return `<div class="pk-panel"><div class="pk-mhead">${mName}</div>

  view.innerHTML=`

    <div class="pk-legend"><span class="lg-label">Occupancy</span>${OCCBANDS.map(x=>`<span class="lg-item"><i style="background:${x[1]}"></i>${x[2]}</span>`).join('')}</div>
    <div class="pk-grid">${panels||'<div class="err">No overlapping stay dates between the two snapshots.</div>'}</div>`;

function renderPickupActuals(){

    <div class="summary"><div class="ic">✦</div><div class="tx">Pick-up for <b>${labelDate(iso)}</b> vs <b>${labelDate(r.base)}</b> — ${gapNote}. Positive = gained vs the comparison date.</div></div>

      <tbody>${trows||'<tr><td colspan="5">No comparable earlier dates.</td></tr>'}</tbody></table></div>
    <div class="hint">* comparison fell back to the nearest earlier available date (a gap in the data). Rooms Δ = rooms sold change; ADR Δ = rate change; Room Rev Δ = room-revenue change.</div>`;

function strInsights(g){

  const highlights=[
    {title:`RGI ${rgi.toFixed(1)} — RevPAR ${(rgi-100).toFixed(0)}% above comp set`,detail:`${R(p.revpar.cm.mp)} vs ${R(p.revpar.cm.cs)} comp-set RevPAR.`},
    {title:`ARI ${ari.toFixed(1)} — ADR ${(ari-100).toFixed(0)}% above comp set`,detail:`${R(p.adr.cm.mp)} vs ${R(p.adr.cm.cs)} comp-set ADR.`},

  ];
  const watch=[];
  [['MPI',mpi,'occupancy'],['ARI',ari,'rate'],['RGI',rgi,'RevPAR']].forEach(([n,v,w])=>{if(v!=null&&v<100)watch.push({title:`${n} below 100 (${v.toFixed(1)})`,detail:`Trailing the comp set on ${w}.`});});
  if(c.revpar.cm.idx!=null&&c.revpar.cm.idx<0)watch.push({title:`RGI ${pct(c.revpar.cm.idx)} vs last year`,detail:`Comp set grew faster than the property in RevPAR terms this month.`});
  if(!watch.length)watch.push({title:'Ahead of the comp set on every metric',detail:'MPI, ARI and RGI all above 100 this month.'});
  const actions=[];
  if(mpi!=null&&ari!=null&&mpi<ari-10)actions.push({title:'Occupancy index lags rate index',detail:`MPI ${mpi.toFixed(1)} vs ARI ${ari.toFixed(1)} — room to grow occupancy while holding the rate premium.`});
  if(ari!=null&&mpi!=null&&ari<mpi-10)actions.push({title:'Rate index lags occupancy index',detail:`ARI ${ari.toFixed(1)} vs MPI ${mpi.toFixed(1)} — headroom to push ADR given the occupancy strength.`});
  if(c.revpar.cm.cs!=null&&c.revpar.cm.mp!=null&&c.revpar.cm.cs>c.revpar.cm.mp)actions.push({title:'Comp set out-growing you YoY',detail:`Comp RevPAR ${pct(c.revpar.cm.cs)} vs your ${pct(c.revpar.cm.mp)} — watch competitor pricing and pace.`});
  if(!actions.length)actions.push({title:'Hold the premium',detail:'Sustain rate discipline while protecting occupancy; monitor comp-set movements weekly.'});
  return {summary,highlights,watch,action_items:actions};
}
function renderSTR(){
  const view=document.getElementById('view');
  const sub=(t,l)=>`<button class="cbtn${STRSUB===t?' on':''}" data-str="${t}">${l}</button>`;
  const subbar=`<div class="tabnav" style="margin:0 0 20px"><div class="cbtns">${sub('monthly','Monthly')}${sub('weekly','Weekly')}</div></div>`;
  const g=STRSUB==='monthly'?(STAR&&STAR.monthly):(STAR&&STAR.weekly);
  let body;
  if(!STAR){body='<div class="err">STR data not loaded yet.</div>';}
  else if(!g){body=`<div class="summary"><div class="ic">✦</div><div class="tx">${STRSUB==='weekly'?'Weekly STAR data will appear here once a weekly STAR report is added to the automation.':'No monthly STAR data available.'}</div></div>`;}
  else{
    body=`<div class="sechead"><h2>${STRSUB==='monthly'?'Monthly':'Weekly'} Performance at a Glance</h2>
      <span class="note">My Property vs. Competitive Set${g.period_label?' · '+g.period_label:''}${g.created?' · Created '+g.created:''}</span></div>
      ${insightsBlock(strInsights(g))}
      ${glanceTable(g.perf,g.period_label||'Performance',false,g.change)}
      ${glanceTable(g.change,(g.period_label?g.period_label+' ':'')+'vs. Last Year — % Change',true)}`;
  }
  view.innerHTML=subbar+body;
  document.querySelectorAll('#view .cbtn[data-str]').forEach(b=>b.onclick=()=>{STRSUB=b.dataset.str;renderSTR();});
}
function render(d){
  DATA=d;
  const dates=Object.keys(d.days).sort().reverse();
  PDATE=d.latest_date;PWIN=1;TAB='dbr';
  document.getElementById('app').innerHTML=`
    <div class="titlerow"><h1>Daily Business Report</h1><div id="controls" style="display:flex;gap:10px;flex-wrap:wrap"></div></div>
    <div class="sub"><span class="badge ok"><span class="dot"></span>Reconciled</span><span>${d.property}</span><span>·</span><span>${dates.length} days available</span></div>
    <div class="tabnav"><div class="tabbar">
      <button class="tab active" data-tab="dbr">DBR</button>
      <button class="tab" data-tab="hf">H&amp;F</button>
      <button class="tab" data-tab="pickup">Pick-up</button>
      <button class="tab" data-tab="str">STR</button>
    </div></div>
    <div id="view"></div>`;
  document.getElementById('stamp').textContent='Updated '+new Date(d.generated_at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
  const h=(location.hash||'').replace('#','');
  selectTab(['dbr','hf','pickup','str'].includes(h)?h:'dbr');
  window.addEventListener('hashchange',()=>{const x=(location.hash||'').replace('#','');if(['dbr','hf','pickup','str'].includes(x)&&x!==TAB)selectTab(x);});
}
fetch('./data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  render(d);
  fetch('./hf.json?ts='+Date.now()).then(r=>r.ok?r.json():null).then(h=>{
    if(h&&h.snaps&&h.dates&&h.dates.length){HF=h;HFSNAP=h.latest;PSNAP=h.latest;PTO=h.latest;PDAYS=1;PFROM=snapFrom(PTO,PDAYS);if(TAB!=='dbr'){setControls();selectTab(TAB);}}
  }).catch(()=>{});
  fetch('./star.json?ts='+Date.now()).then(r=>r.ok?r.json():null).then(s=>{
    if(s){STAR=s;if(TAB==='str')renderSTR();}
  }).catch(()=>{});
}).catch(()=>{document.getElementById('app').innerHTML='<div class="err">No report data yet.</div>';});
</script>
